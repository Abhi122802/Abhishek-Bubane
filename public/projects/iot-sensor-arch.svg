<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-iot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111B30"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-iot)" rx="16"/>
  <rect width="800" height="450" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" rx="16"/>

  <g transform="translate(30, 36)">
    <rect width="410" height="26" rx="6" fill="#111B30" stroke="#10B981" stroke-opacity="0.3"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SATHE ENGINEERING • ANDROID SENSOR TELEMETRY PIPELINE</text>
    <rect x="520" y="0" width="220" height="26" rx="6" fill="#070B14" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="532" y="17" fill="#94A3B8" font-family="monospace" font-size="9" letter-spacing="0.5">REPRESENTATIVE ARCHITECTURE</text>
  </g>

  <path d="M 190 200 L 260 200" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 370 200 L 440 200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 550 200 L 620 200" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- NODE 1 -->
  <g transform="translate(50, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#10B981" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Hardware Node</text>
    <text x="14" y="58" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">Industrial Sensors</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Active Machinery</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Temperature Transducer</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Humidity Gauge</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Motion Accelerometer</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Continuous Polling</text>
  </g>

  <!-- NODE 2 -->
  <g transform="translate(230, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Android Client</text>
    <text x="14" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">Java / Android SDK</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Mobile Telemetry</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Background Worker</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Local SQLite Buffer</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Real-Time Charts</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Offline Cache Resilient</text>
  </g>

  <!-- NODE 3 -->
  <g transform="translate(410, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#22D3EE" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Ingestion API</text>
    <text x="14" y="58" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="600">Node / REST API</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cloud Telemetry Bus</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Ingestion Gateway</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Payload Validation</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Anomaly Thresholds</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Alert Dispatcher</text>
  </g>

  <!-- NODE 4 -->
  <g transform="translate(590, 120)">
    <rect width="160" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#E0F2FE" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="#111B30" stroke="#E0F2FE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4. Operator View</text>
    <text x="14" y="58" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">Field Monitoring</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Sathe Engineering UI</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• High-Visibility KPIs</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Thermal Spike Alert</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Historical Shift Log</text>
    <text x="14" y="154" fill="#10B981" font-family="system-ui, sans-serif" font-size="9">Plant Floor Terminal</text>
  </g>

  <g transform="translate(50, 330)">
    <rect width="700" height="70" rx="10" fill="#111B30" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="28" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Industrial IoT Telemetry Pipeline</text>
    <text x="24" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Engineered for harsh industrial plant environments, providing resilient local SQLite caching during network disconnects and immediate thermal/vibration anomaly alerting.</text>
  </g>
</svg>
