<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-omni" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111B30"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad-omni)" rx="16"/>
  <rect width="800" height="450" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" rx="16"/>

  <!-- Watermark / Status Header -->
  <g transform="translate(30, 36)">
    <rect width="400" height="26" rx="6" fill="#111B30" stroke="#38BDF8" stroke-opacity="0.3"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OMNICHANNEL ANALYTICS • 1.2M+ TRANSACTION PIPELINE</text>
    <rect x="520" y="0" width="220" height="26" rx="6" fill="#070B14" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="532" y="17" fill="#94A3B8" font-family="monospace" font-size="9" letter-spacing="0.5">REPRESENTATIVE ARCHITECTURE</text>
  </g>

  <!-- Connectors -->
  <path d="M 190 200 L 260 200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 370 200 L 440 200" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 550 200 L 620 200" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- NODE 1: Multi-Channel Ingestion -->
  <g transform="translate(50, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Data Ingestion</text>
    <text x="14" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">Omni Channels</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">1.2M+ Transactions</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Retail POS Feeds</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• E-Comm Checkout</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Subscription Logs</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Daily Delta Batches</text>
  </g>

  <!-- NODE 2: Data Transformation & Modeling -->
  <g transform="translate(230, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#22D3EE" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. SQL Modeling</text>
    <text x="14" y="58" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="600">PostgreSQL / SQL</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Star Schema Mart</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Dim_Customer</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Dim_Channel</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Fact_Revenue</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Aggregated Mappings</text>
  </g>

  <!-- NODE 3: Cohort & LTV Engine -->
  <g transform="translate(410, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#818CF8" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Retention Logic</text>
    <text x="14" y="58" fill="#818CF8" font-family="monospace" font-size="11" font-weight="600">Pandas & Python</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cohort Decay Matrix</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• 30/60/90D Retention</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• LTV Expansion</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Churn Attribution</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Segment Decay curves</text>
  </g>

  <!-- NODE 4: Executive BI Dashboards -->
  <g transform="translate(590, 120)">
    <rect width="160" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#E0F2FE" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="#111B30" stroke="#E0F2FE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4. Executive BI</text>
    <text x="14" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">Power BI / Recharts</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Interactive Reports</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Target vs Realized</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Heatmap Retention</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Acquisition ROI</text>
    <text x="14" y="154" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">Automated Refresh</text>
  </g>

  <!-- Bottom Spec Footnote -->
  <g transform="translate(50, 330)">
    <rect width="700" height="70" rx="10" fill="#111B30" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="28" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Analytical Engineering Impact</text>
    <text x="24" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Replaced 14-day manual CSV spreadsheet consolidation with an automated analytical data pipeline, surfacing granular cohort decay trends and cross-sell opportunities.</text>
  </g>
</svg>
