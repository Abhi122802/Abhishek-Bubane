<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-qa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#111B30"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg-grad-qa)" rx="16"/>
  <rect width="800" height="450" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" rx="16"/>

  <!-- Watermark / Status Header -->
  <g transform="translate(30, 36)">
    <rect width="420" height="26" rx="6" fill="#111B30" stroke="#38BDF8" stroke-opacity="0.3"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">QA-PRAMAAN • MORTGAGE LOAN APPRAISAL AUDIT ENGINE</text>
    <rect x="520" y="0" width="220" height="26" rx="6" fill="#070B14" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="532" y="17" fill="#94A3B8" font-family="monospace" font-size="9" letter-spacing="0.5">REPRESENTATIVE ARCHITECTURE</text>
  </g>

  <!-- Connectors -->
  <path d="M 190 200 L 260 200" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 370 200 L 440 200" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <path d="M 550 200 L 620 200" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- NODE 1: Ingestion -->
  <g transform="translate(50, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. File Ingestion</text>
    <text x="14" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">Loan Documents</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Appraisal Packages</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Borrower Profiles</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Valuation Metrics</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Legal Disclosures</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Structured Attributes</text>
  </g>

  <!-- NODE 2: Django Rule Engine -->
  <g transform="translate(230, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#818CF8" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Compliance Logic</text>
    <text x="14" y="58" fill="#818CF8" font-family="monospace" font-size="11" font-weight="600">Python & Django</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Audit Rule Evaluator</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Missing Field Check</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Variance Thresholds</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Underwriting Rules</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Zero-Error Gateways</text>
  </g>

  <!-- NODE 3: Relational SQL Verification -->
  <g transform="translate(410, 120)">
    <rect width="140" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#22D3EE" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="34" rx="12" fill="#111B30" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Database Schema</text>
    <text x="14" y="58" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="600">SQL Data Store</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Relational Ledger</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Audit Trail Entries</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Exception Flag Store</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Historical Verifications</text>
    <text x="14" y="154" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Indexed Lookups</text>
  </g>

  <!-- NODE 4: Auditor React Screen -->
  <g transform="translate(590, 120)">
    <rect width="160" height="170" rx="12" fill="#070B14" fill-opacity="0.9" stroke="#E0F2FE" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="#111B30" stroke="#E0F2FE" stroke-opacity="0.3"/>
    <text x="14" y="22" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4. Auditor Interface</text>
    <text x="14" y="58" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="600">React & REST API</text>
    <text x="14" y="76" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Live Verification UI</text>
    <text x="14" y="100" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Rapid Discrepancy UI</text>
    <text x="14" y="118" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Instant Red-Flagging</text>
    <text x="14" y="136" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="10">• Export Audit Log</text>
    <text x="14" y="154" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">qa-pramaan.vercel.app</text>
  </g>

  <!-- Bottom Spec Footnote -->
  <g transform="translate(50, 330)">
    <rect width="700" height="70" rx="10" fill="#111B30" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="24" y="28" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Compliance Auditing Logic</text>
    <text x="24" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Automates complex mortgage loan document validation checks, highlighting attribute inconsistencies, missing signatures, and property valuation discrepancies in real-time.</text>
  </g>
</svg>
